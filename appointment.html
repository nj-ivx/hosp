<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Appointment · Feras Company Medical Portal</title>
<link rel="stylesheet" href="styles.css">
<style>
  .form-shell { padding: 32px 0 60px; }
  .form-head { margin-bottom: 24px; }
  .form-head h1 { font-size: 24px; margin-bottom: 6px; }
  .back-link { font-size: 13px; text-decoration: none; color: var(--ink-muted); }
  .back-link:hover { color: var(--primary); }
  .success-screen { display: none; text-align: center; padding: 60px 24px; }
  .success-screen .icon { font-size: 40px; margin-bottom: 12px; display: block; }
  .card-form { padding: 28px; max-width: 560px; margin: 0 auto; }
  select:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="page">

  <nav class="navbar">
    <div class="container">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
            <rect width="28" height="28" rx="8" fill="url(#logoGradP)"/>
            <path d="M14 7v14M7 14h14" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <defs><linearGradient id="logoGradP" x1="0" y1="0" x2="28" y2="28">
              <stop stop-color="#0B5D66"/><stop offset="1" stop-color="#2FBFA0"/>
            </linearGradient></defs>
          </svg>
        </span>
        <span data-i18n="brand">Feras Company Medical Portal</span>
      </div>
      <div class="nav-actions">
        <button class="lang-toggle" id="langToggle">AR</button>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"></button>
      </div>
    </div>
  </nav>

  <svg class="vital-line" viewBox="0 0 400 28" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 14 H140 L155 4 L170 24 L185 14 H400"/>
  </svg>

  <main class="container form-shell">
    <a class="back-link" href="index.html" data-i18n="back_dashboard">← Back to dashboard</a>

    <div id="formWrap">
      <div class="form-head center">
        <h1 data-i18n="appt_title">Book an Appointment</h1>
        <p class="muted" data-i18n="appt_sub">Pick a hospital, a doctor, and a time that works for you.</p>
      </div>

      <div id="formAlert" class="alert alert-error" hidden role="alert"></div>

      <form id="apptForm" class="card card-form">
        <div class="field">
          <label for="patient_name" data-i18n="label_full_name">Full name *</label>
          <input type="text" id="patient_name" name="patient_name" required>
        </div>
        <div class="field">
          <label for="patient_email" data-i18n="label_email">Email *</label>
          <input type="email" id="patient_email" name="patient_email" required>
        </div>
        <div class="field">
          <label for="hospitalSelect" data-i18n="label_hospital">Hospital *</label>
          <select id="hospitalSelect" required>
            <option value="" data-i18n="select_option">Select…</option>
          </select>
        </div>
        <div class="field">
          <label for="doctorSelect" data-i18n="label_doctor">Doctor *</label>
          <select id="doctorSelect" required disabled>
            <option value="" data-i18n="select_hospital_first">Choose a hospital first…</option>
          </select>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="appointment_date" data-i18n="label_date">Date *</label>
            <input type="date" id="appointment_date" name="appointment_date" required>
          </div>
          <div class="field">
            <label for="appointment_time" data-i18n="label_time">Time *</label>
            <input type="time" id="appointment_time" name="appointment_time" required>
          </div>
        </div>
        <div class="field">
          <label for="reason" data-i18n="label_reason">Reason for visit</label>
          <textarea id="reason" name="reason" rows="3" placeholder="Briefly describe why you're booking"></textarea>
        </div>
        <div class="row" style="justify-content: flex-end; gap: 12px;">
          <a class="btn btn-ghost" href="index.html" data-i18n="btn_cancel">Cancel</a>
          <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="btn_book_appt">Book Appointment</button>
        </div>
      </form>
    </div>

    <div id="successScreen" class="success-screen card">
      <span class="icon">📅</span>
      <h2 data-i18n="appt_success_title">Appointment requested</h2>
      <p class="muted" data-i18n="appt_success_desc">We've logged your request as pending confirmation.</p>
      <div class="row" style="justify-content:center; margin-top:20px;">
        <a class="btn btn-primary" href="index.html" data-i18n="back_dashboard">Back to dashboard</a>
        <button class="btn btn-ghost" id="bookAnotherBtn" data-i18n="btn_book_another">Book another</button>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="i18n.js"></script>
<!-- Chatbase floating widget -->
<script>
  window.chatbaseConfig = { chatbotId: "Ie42z57d6pT_nwLvZF5c7" };
</script>
<script src="https://www.chatbase.co/embed.min.js" id="Ie42z57d6pT_nwLvZF5c7" defer></script>
<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById("themeToggle");
  function applyTheme(t) { root.setAttribute("data-theme", t); localStorage.setItem("theme", t); }
  applyTheme(localStorage.getItem("theme") || "light");
  themeToggle.addEventListener("click", () => {
    applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  let currentUserId = null;
  let hospitals = [];
  let doctors = [];

  const hospitalSelect = document.getElementById("hospitalSelect");
  const doctorSelect = document.getElementById("doctorSelect");

  (async () => {
    if (!window.supabaseClient) return;
    const session = await window.requireSession("auth.html");
    if (!session) return;
    currentUserId = session.user.id;
    document.getElementById("patient_email").value = session.user.email || "";
    await loadHospitalsAndDoctors();
  })();

  async function loadHospitalsAndDoctors() {
    try {
      const [{ data: hData, error: hErr }, { data: dData, error: dErr }] = await Promise.all([
        window.supabaseClient.from("hospitals").select("*").order("name"),
        window.supabaseClient.from("doctors").select("*").order("name"),
      ]);
      if (hErr) throw hErr;
      if (dErr) throw dErr;
      hospitals = hData || [];
      doctors = dData || [];

      hospitalSelect.innerHTML = '<option value="">Select…</option>' +
        hospitals.map(h => `<option value="${h.id}">${escapeHtml(h.name)}</option>`).join("");
    } catch (err) {
      showAlert("Couldn't load hospitals and doctors right now. Please refresh the page.");
    }
  }

  hospitalSelect.addEventListener("change", () => {
    const hospitalId = hospitalSelect.value;
    const matching = doctors.filter(d => d.hospital_id === hospitalId);
    if (!hospitalId) {
      doctorSelect.innerHTML = '<option value="">Choose a hospital first…</option>';
      doctorSelect.disabled = true;
      return;
    }
    if (matching.length === 0) {
      doctorSelect.innerHTML = '<option value="">No doctors listed at this hospital yet</option>';
      doctorSelect.disabled = true;
      return;
    }
    doctorSelect.disabled = false;
    doctorSelect.innerHTML = '<option value="">Select…</option>' +
      matching.map(d => `<option value="${d.id}">${escapeHtml(d.name)}${d.specialty ? " — " + escapeHtml(d.specialty) : ""}</option>`).join("");
  });

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  const formAlert = document.getElementById("formAlert");
  function showAlert(msg) { formAlert.textContent = msg; formAlert.hidden = false; }
  function hideAlert() { formAlert.hidden = true; }

  const form = document.getElementById("apptForm");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideAlert();

    if (!window.supabaseClient || !currentUserId) {
      showAlert("Can't reach the database service right now. Please refresh and try again.");
      return;
    }

    const hospital = hospitals.find(h => h.id === hospitalSelect.value);
    const doctor = doctors.find(d => d.id === doctorSelect.value);
    if (!hospital || !doctor) {
      showAlert("Please choose both a hospital and a doctor.");
      return;
    }

    const formData = new FormData(form);
    const record = Object.fromEntries(formData.entries());
    record.user_id = currentUserId;
    record.status = "pending";
    record.hospital_id = hospital.id;
    record.hospital_name = hospital.name;
    record.doctor_id = doctor.id;
    record.doctor_name = doctor.name;
    record.department = doctor.department || doctor.specialty || "";

    submitBtn.disabled = true;
    submitBtn.textContent = "Booking…";

    try {
      const { error } = await window.supabaseClient.from("appointments").insert([record]);
      if (error) throw error;

      document.getElementById("formWrap").style.display = "none";
      document.getElementById("successScreen").style.display = "block";
    } catch (err) {
      showAlert(err.message || "Couldn't book the appointment. Please check your entries and try again.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Book Appointment";
    }
  });

  document.getElementById("bookAnotherBtn").addEventListener("click", () => {
    form.reset();
    document.getElementById("patient_email").value = "";
    doctorSelect.innerHTML = '<option value="">Choose a hospital first…</option>';
    doctorSelect.disabled = true;
    document.getElementById("successScreen").style.display = "none";
    document.getElementById("formWrap").style.display = "block";
  });
</script>
</body>
</html>
