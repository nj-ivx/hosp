<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · Feras Company Medical Portal</title>
<link rel="stylesheet" href="styles.css">
<style>
  .auth-shell {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .auth-card { width: 100%; max-width: 420px; padding: 36px; }
  .auth-head { text-align: center; margin-bottom: 24px; }
  .auth-head h1 { font-size: 22px; margin-bottom: 6px; }
  .tabs {
    display: flex;
    background: var(--primary-soft);
    border-radius: var(--radius-sm);
    padding: 4px;
    margin-bottom: 24px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 8px 0;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-muted);
    border-radius: 6px;
    cursor: pointer;
    transition: background var(--transition), color var(--transition);
  }
  .tab.active { background: var(--bg-elevated); color: var(--primary); box-shadow: var(--shadow-sm); }
  .auth-form { display: none; }
  .auth-form.active { display: block; }
  .fine-print { font-size: 12px; text-align: center; margin-top: 18px; }
</style>
</head>
<body>
<div class="page">

  <nav class="navbar">
    <div class="container">
      <div class="brand"><span class="mark">✚</span> Feras Company Medical Portal</div>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"></button>
      </div>
    </div>
  </nav>

  <svg class="vital-line" viewBox="0 0 400 28" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 14 H140 L155 4 L170 24 L185 14 H400"/>
  </svg>

  <main class="auth-shell">
    <div class="card-float auth-card">
      <div class="auth-head">
        <h1>Welcome</h1>
        <p class="muted">Sign in to manage patient records</p>
      </div>

      <div class="tabs">
        <div class="tab active" data-tab="login">Log In</div>
        <div class="tab" data-tab="signup">Sign Up</div>
      </div>

      <div id="globalAlert" class="alert alert-error" hidden role="alert"></div>

      <!-- Login -->
      <form id="loginForm" class="auth-form active stack">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" required autocomplete="email">
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
      </form>

      <!-- Sign up -->
      <form id="signupForm" class="auth-form stack">
        <div class="grid-2">
          <div class="field">
            <label for="suFirst">First name</label>
            <input type="text" id="suFirst" required autocomplete="given-name">
          </div>
          <div class="field">
            <label for="suLast">Last name</label>
            <input type="text" id="suLast" required autocomplete="family-name">
          </div>
        </div>
        <div class="field">
          <label for="suEmail">Email</label>
          <input type="email" id="suEmail" required autocomplete="email">
        </div>
        <div class="field">
          <label for="suPassword">Password</label>
          <input type="password" id="suPassword" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="signupBtn">Create Account</button>
      </form>

      <p class="fine-print muted">New accounts are created with standard patient access.</p>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script>
  // ---- Theme persistence ----
  const root = document.documentElement;
  const themeToggle = document.getElementById("themeToggle");
  function applyTheme(t) { root.setAttribute("data-theme", t); localStorage.setItem("theme", t); }
  applyTheme(localStorage.getItem("theme") || "light");
  themeToggle.addEventListener("click", () => {
    applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  // ---- Tab toggle ----
  const tabs = document.querySelectorAll(".tab");
  const forms = { login: document.getElementById("loginForm"), signup: document.getElementById("signupForm") };
  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      tabs.forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      Object.values(forms).forEach(f => f.classList.remove("active"));
      forms[tab.dataset.tab].classList.add("active");
      hideAlert();
    });
  });

  // ---- Alert fail-safe ----
  const alertBox = document.getElementById("globalAlert");
  function showAlert(message, type = "error") {
    alertBox.textContent = message;
    alertBox.className = `alert alert-${type}`;
    alertBox.hidden = false;
  }
  function hideAlert() { alertBox.hidden = true; }

  function setLoading(btn, loading, label) {
    btn.disabled = loading;
    btn.textContent = loading ? "Please wait…" : label;
  }

  // ---- Guard: bail out cleanly if Supabase never initialized ----
  function clientReady() {
    if (!window.supabaseClient) {
      showAlert("Can't reach the authentication service right now. Please refresh or try again shortly.");
      return false;
    }
    return true;
  }

  // ---- Login ----
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideAlert();
    if (!clientReady()) return;

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const btn = document.getElementById("loginBtn");
    setLoading(btn, true, "Log In");

    try {
      const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error;
      window.location.href = "index.html";
    } catch (err) {
      showAlert(err.message || "Login failed. Check your credentials and try again.");
    } finally {
      setLoading(btn, false, "Log In");
    }
  });

  // ---- Sign up ----
  document.getElementById("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideAlert();
    if (!clientReady()) return;

    const first_name = document.getElementById("suFirst").value.trim();
    const last_name = document.getElementById("suLast").value.trim();
    const email = document.getElementById("suEmail").value.trim();
    const password = document.getElementById("suPassword").value;
    const btn = document.getElementById("signupBtn");
    setLoading(btn, true, "Create Account");

    try {
      const { data, error } = await window.supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { first_name, last_name } },
      });
      if (error) throw error;

      const userId = data.user ? data.user.id : (data.session ? data.session.user.id : null);
      if (userId) {
        const { error: roleError } = await window.supabaseClient
          .from("user_roles")
          .insert([{ user_id: userId, role: "user" }]);
        if (roleError) {
          // Account exists but role row failed — surface it rather than
          // silently leaving the user without an entry in user_roles.
          console.error("[auth] role insert failed:", roleError.message);
          showAlert("Account created, but we couldn't finish setting up your access. Contact an administrator.", "warning");
          return;
        }
      }

      if (data.session) {
        window.location.href = "index.html";
      } else {
        showAlert("Account created. Check your email to confirm before logging in.", "success");
        document.querySelector('[data-tab="login"]').click();
      }
    } catch (err) {
      showAlert(err.message || "Sign up failed. Please try again.");
    } finally {
      setLoading(btn, false, "Create Account");
    }
  });

  // ---- If already logged in, skip straight to dashboard ----
  (async () => {
    if (!window.supabaseClient) return;
    const { data: { session } } = await window.supabaseClient.auth.getSession();
    if (session) window.location.href = "index.html";
  })();
</script>
</body>
</html>
