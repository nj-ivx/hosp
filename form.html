<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Intake · Feras Company Medical Portal</title>
<link rel="stylesheet" href="styles.css">
<style>
  .form-shell { padding: 32px 0 60px; }
  .form-head { margin-bottom: 24px; }
  .form-head h1 { font-size: 24px; margin-bottom: 6px; }
  .back-link { font-size: 13px; text-decoration: none; color: var(--ink-muted); }
  .back-link:hover { color: var(--primary); }
  .success-screen {
    display: none;
    text-align: center;
    padding: 60px 24px;
  }
  .success-screen .icon { font-size: 40px; margin-bottom: 12px; display: block; }
</style>
</head>
<body>
<div class="page">

  <nav class="navbar">
    <div class="container">
      <div class="brand"><span class="mark">✚</span> Feras Company Medical Portal</div>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"></button>
      </div>
    </div>
  </nav>

  <svg class="vital-line" viewBox="0 0 400 28" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 14 H140 L155 4 L170 24 L185 14 H400"/>
  </svg>

  <main class="container form-shell">
    <a class="back-link" href="index.html">← Back to dashboard</a>

    <div id="formWrap">
      <div class="form-head">
        <h1>Patient Intake Form</h1>
        <p class="muted">All fields marked required must be completed before submitting.</p>
      </div>

      <div id="formAlert" class="alert alert-error" hidden role="alert"></div>

      <form id="intakeForm" class="card" style="padding: 28px;">

        <fieldset>
          <legend>Personal Information</legend>
          <div class="grid-2">
            <div class="field">
              <label for="first_name">First name *</label>
              <input type="text" id="first_name" name="first_name" required>
            </div>
            <div class="field">
              <label for="last_name">Last name *</label>
              <input type="text" id="last_name" name="last_name" required>
            </div>
          </div>
          <div class="grid-3">
            <div class="field">
              <label for="dob">Date of birth *</label>
              <input type="date" id="dob" name="dob" required>
            </div>
            <div class="field">
              <label for="gender">Gender</label>
              <select id="gender" name="gender">
                <option value="">Select…</option>
                <option>Female</option>
                <option>Male</option>
                <option>Other</option>
                <option>Prefer not to say</option>
              </select>
            </div>
            <div class="field">
              <label for="phone">Phone *</label>
              <input type="tel" id="phone" name="phone" required>
            </div>
          </div>
          <div class="grid-2">
            <div class="field">
              <label for="email">Email *</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div class="field">
              <label for="address">Address</label>
              <input type="text" id="address" name="address">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Medical History</legend>
          <div class="grid-2">
            <div class="field">
              <label for="blood_type">Blood type</label>
              <select id="blood_type" name="blood_type">
                <option value="">Unknown</option>
                <option>A+</option><option>A-</option>
                <option>B+</option><option>B-</option>
                <option>AB+</option><option>AB-</option>
                <option>O+</option><option>O-</option>
              </select>
            </div>
            <div class="field">
              <label for="weight">Weight (kg)</label>
              <input type="number" id="weight" name="weight" min="0" step="0.1">
            </div>
          </div>
          <div class="field">
            <label for="allergies">Known allergies</label>
            <textarea id="allergies" name="allergies" rows="2" placeholder="e.g. Penicillin, peanuts"></textarea>
          </div>
          <div class="field">
            <label for="medications">Current medications</label>
            <textarea id="medications" name="medications" rows="2"></textarea>
          </div>
          <div class="field">
            <label for="conditions">Existing conditions</label>
            <textarea id="conditions" name="conditions" rows="2"></textarea>
          </div>
        </fieldset>

        <fieldset>
          <legend>Insurance</legend>
          <div class="grid-2">
            <div class="field">
              <label for="insurance_provider">Provider</label>
              <input type="text" id="insurance_provider" name="insurance_provider">
            </div>
            <div class="field">
              <label for="policy_number">Policy number</label>
              <input type="text" id="policy_number" name="policy_number">
            </div>
          </div>
        </fieldset>

        <div class="row" style="justify-content: flex-end; gap: 12px;">
          <a class="btn btn-ghost" href="index.html">Cancel</a>
          <button type="submit" class="btn btn-primary" id="submitBtn">Submit Intake Form</button>
        </div>
      </form>
    </div>

    <div id="successScreen" class="success-screen card">
      <span class="icon">✅</span>
      <h2>Form submitted</h2>
      <p class="muted">The patient record has been saved.</p>
      <div class="row" style="justify-content:center; margin-top:20px;">
        <a class="btn btn-primary" href="index.html">Back to dashboard</a>
        <button class="btn btn-ghost" id="submitAnotherBtn">Submit another</button>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById("themeToggle");
  function applyTheme(t) { root.setAttribute("data-theme", t); localStorage.setItem("theme", t); }
  applyTheme(localStorage.getItem("theme") || "light");
  themeToggle.addEventListener("click", () => {
    applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  // Require an active session before allowing form access
  (async () => {
    if (window.supabaseClient) await window.requireSession("auth.html");
  })();

  const formAlert = document.getElementById("formAlert");
  function showAlert(msg) { formAlert.textContent = msg; formAlert.hidden = false; }
  function hideAlert() { formAlert.hidden = true; }

  const form = document.getElementById("intakeForm");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideAlert();

    if (!window.supabaseClient) {
      showAlert("Can't reach the database service right now. Please refresh and try again.");
      return;
    }

    const formData = new FormData(form);
    const record = Object.fromEntries(formData.entries());

    // Normalize empty numeric field
    record.weight = record.weight ? Number(record.weight) : null;

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting…";

    try {
      const { error } = await window.supabaseClient.from("patients").insert([record]);
      if (error) throw error;

      document.getElementById("formWrap").style.display = "none";
      document.getElementById("successScreen").style.display = "block";
    } catch (err) {
      showAlert(err.message || "Couldn't save the form. Please check your entries and try again.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit Intake Form";
    }
  });

  document.getElementById("submitAnotherBtn").addEventListener("click", () => {
    form.reset();
    document.getElementById("successScreen").style.display = "none";
    document.getElementById("formWrap").style.display = "block";
  });
</script>
</body>
</html>
