<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Intake · Feras Company Medical Portal</title>
<link rel="stylesheet" href="styles.css">
<style>
  .form-shell { padding: 32px 0 60px; }
  .form-head { margin-bottom: 24px; }
  .form-head h1 { font-size: 24px; margin-bottom: 6px; }
  .back-link { font-size: 13px; text-decoration: none; color: var(--ink-muted); }
  .back-link:hover { color: var(--primary); }
  .success-screen {
    display: none;
    text-align: center;
    padding: 60px 24px;
  }
  .success-screen .icon { font-size: 40px; margin-bottom: 12px; display: block; }
</style>
</head>
<body>
<div class="page">

  <nav class="navbar">
    <div class="container">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
            <rect width="28" height="28" rx="8" fill="url(#logoGradF)"/>
            <path d="M14 7v14M7 14h14" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <defs><linearGradient id="logoGradF" x1="0" y1="0" x2="28" y2="28">
              <stop stop-color="#0B5D66"/><stop offset="1" stop-color="#2FBFA0"/>
            </linearGradient></defs>
          </svg>
        </span>
        <span data-i18n="brand">Feras Company Medical Portal</span>
      </div>
      <div class="nav-actions">
        <button class="lang-toggle" id="langToggle">AR</button>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"></button>
      </div>
    </div>
  </nav>

  <svg class="vital-line" viewBox="0 0 400 28" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 14 H140 L155 4 L170 24 L185 14 H400"/>
  </svg>

  <main class="container form-shell">
    <a class="back-link" href="index.html" data-i18n="back_dashboard">← Back to dashboard</a>

    <div id="formWrap">
      <div class="form-head">
        <h1 data-i18n="intake_title">Patient Intake Form</h1>
        <p class="muted" data-i18n="intake_sub">All fields marked required must be completed before submitting.</p>
      </div>

      <div id="formAlert" class="alert alert-error" hidden role="alert"></div>

      <form id="intakeForm" class="card" style="padding: 28px;">

        <fieldset>
          <legend data-i18n="section_personal">Personal Information</legend>
          <div class="grid-2">
            <div class="field">
              <label for="first_name" data-i18n="label_first_name">First name *</label>
              <input type="text" id="first_name" name="first_name" required>
            </div>
            <div class="field">
              <label for="last_name" data-i18n="label_last_name">Last name *</label>
              <input type="text" id="last_name" name="last_name" required>
            </div>
          </div>
          <div class="grid-3">
            <div class="field">
              <label for="dob" data-i18n="label_dob">Date of birth *</label>
              <input type="date" id="dob" name="dob" required>
            </div>
            <div class="field">
              <label for="gender" data-i18n="label_gender">Gender</label>
              <select id="gender" name="gender">
                <option value="">Select…</option>
                <option>Female</option>
                <option>Male</option>
                <option>Other</option>
                <option>Prefer not to say</option>
              </select>
            </div>
            <div class="field">
              <label for="phone" data-i18n="label_phone">Phone *</label>
              <input type="tel" id="phone" name="phone" required>
            </div>
          </div>
          <div class="grid-2">
            <div class="field">
              <label for="email" data-i18n="label_email">Email *</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div class="field">
              <label for="address" data-i18n="label_address">Address</label>
              <input type="text" id="address" name="address">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="section_medical">Medical History</legend>
          <div class="grid-2">
            <div class="field">
              <label for="blood_type" data-i18n="label_blood_type">Blood type</label>
              <select id="blood_type" name="blood_type">
                <option value="">Unknown</option>
                <option>A+</option><option>A-</option>
                <option>B+</option><option>B-</option>
                <option>AB+</option><option>AB-</option>
                <option>O+</option><option>O-</option>
              </select>
            </div>
            <div class="field">
              <label for="weight" data-i18n="label_weight">Weight (kg)</label>
              <input type="number" id="weight" name="weight" min="0" step="0.1">
            </div>
          </div>
          <div class="field">
            <label for="allergies" data-i18n="label_allergies">Known allergies</label>
            <textarea id="allergies" name="allergies" rows="2" placeholder="e.g. Penicillin, peanuts"></textarea>
          </div>
          <div class="field">
            <label for="medications" data-i18n="label_medications">Current medications</label>
            <textarea id="medications" name="medications" rows="2"></textarea>
          </div>
          <div class="field">
            <label for="conditions" data-i18n="label_conditions">Existing conditions</label>
            <textarea id="conditions" name="conditions" rows="2"></textarea>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="section_insurance">Insurance</legend>
          <div class="grid-2">
            <div class="field">
              <label for="insurance_provider" data-i18n="label_provider">Provider</label>
              <input type="text" id="insurance_provider" name="insurance_provider">
            </div>
            <div class="field">
              <label for="policy_number" data-i18n="label_policy">Policy number</label>
              <input type="text" id="policy_number" name="policy_number">
            </div>
          </div>
        </fieldset>

        <div class="row" style="justify-content: flex-end; gap: 12px;">
          <a class="btn btn-ghost" href="index.html" data-i18n="btn_cancel">Cancel</a>
          <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="btn_submit_intake">Submit Intake Form</button>
        </div>
      </form>
    </div>

    <div id="successScreen" class="success-screen card">
      <span class="icon">✅</span>
      <h2 data-i18n="intake_success_title">Form submitted</h2>
      <p class="muted" data-i18n="intake_success_desc">The patient record has been saved.</p>
      <div class="row" style="justify-content:center; margin-top:20px;">
        <a class="btn btn-primary" href="index.html" data-i18n="back_dashboard">Back to dashboard</a>
        <button class="btn btn-ghost" id="submitAnotherBtn" data-i18n="btn_submit_another">Submit another</button>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="i18n.js"></script>
<!-- Chatbase floating widget -->
<script>
  window.chatbaseConfig = { chatbotId: "Ie42z57d6pT_nwLvZF5c7" };
</script>
<script src="https://www.chatbase.co/embed.min.js" id="Ie42z57d6pT_nwLvZF5c7" defer></script>
<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById("themeToggle");
  function applyTheme(t) { root.setAttribute("data-theme", t); localStorage.setItem("theme", t); }
  applyTheme(localStorage.getItem("theme") || "light");
  themeToggle.addEventListener("click", () => {
    applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  // Require an active session before allowing form access
  (async () => {
    if (window.supabaseClient) await window.requireSession("auth.html");
  })();

  const formAlert = document.getElementById("formAlert");
  function showAlert(msg) { formAlert.textContent = msg; formAlert.hidden = false; }
  function hideAlert() { formAlert.hidden = true; }

  const form = document.getElementById("intakeForm");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideAlert();

    if (!window.supabaseClient) {
      showAlert("Can't reach the database service right now. Please refresh and try again.");
      return;
    }

    const formData = new FormData(form);
    const record = Object.fromEntries(formData.entries());

    // Normalize empty numeric field
    record.weight = record.weight ? Number(record.weight) : null;

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting…";

    try {
      const { error } = await window.supabaseClient.from("patients").insert([record]);
      if (error) throw error;

      document.getElementById("formWrap").style.display = "none";
      document.getElementById("successScreen").style.display = "block";
    } catch (err) {
      showAlert(err.message || "Couldn't save the form. Please check your entries and try again.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit Intake Form";
    }
  });

  document.getElementById("submitAnotherBtn").addEventListener("click", () => {
    form.reset();
    document.getElementById("successScreen").style.display = "none";
    document.getElementById("formWrap").style.display = "block";
  });
</script>
</body>
</html>
